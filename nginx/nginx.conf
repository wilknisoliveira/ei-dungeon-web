events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_accept_language $accept_language {
        ~*^pt-BR  pt-BR;
        ~*^pt     pt-BR;
        ~*^es     es;
        ~*^en     en;
        default   en;
    }

    map $http_cookie $preferred_language {
        default          $accept_language;
        "~*language=pt-BR" pt-BR;
        "~*language=es"    es;
        "~*language=en"    en;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            return 302 /$preferred_language/;
        }

        location ~ ^/(?!en/|es/|pt-BR/)(.*) {
            return 302 /$preferred_language/$1$is_args$args;
        }

        location /en/ {
            try_files $uri $uri/ /en/index.html?$args;
        }

        location /es/ {
            try_files $uri $uri/ /es/index.html?$args;
        }

        location /pt-BR/ {
            try_files $uri $uri/ /pt-BR/index.html?$args;
        }

        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
