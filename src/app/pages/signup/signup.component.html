<section>
    <div class="atmospheric-bg"></div>
    <app-loading [isLoading]="loading"></app-loading>
    <div class="main-container" *ngIf="!loading">
        <div class="login">
            <div class="theme-button">
                <app-theme-toggle></app-theme-toggle>
            </div>
            <div class="title">
                <app-branding-icon></app-branding-icon>
                <span class="wordmark">EI-DUNGEON</span>
            </div>
            <div class="description">Sign Up</div>

            <form (ngSubmit)="onSubmit()" #form="ngForm">
                <mat-form-field class="example-full-width">
                    <mat-label>Username</mat-label>
                    <input
                        matInput
                        [(ngModel)]="userSignUp.userName"
                        name="username"
                        required
                        (blur)="onUsernameBlur()"
                    />
                </mat-form-field>
                <div
                    class="availability-error"
                    *ngIf="usernameAvailable === false"
                >
                    Username is already taken
                </div>
                <div
                    class="availability-checking"
                    *ngIf="usernameChecking"
                >
                    Checking availability...
                </div>

                <mat-form-field class="example-full-width">
                    <mat-label>Fullname</mat-label>
                    <input
                        matInput
                        [(ngModel)]="userSignUp.fullName"
                        name="fullName"
                        required
                    />
                </mat-form-field>

                <mat-form-field class="example-full-width">
                    <mat-label>Email</mat-label>
                    <input
                        type="email"
                        matInput
                        [(ngModel)]="userSignUp.email"
                        [formControl]="emailFormControl"
                        placeholder="Ex. pat@example.com"
                        required=""
                        (blur)="onEmailBlur()"
                    />
                    <mat-error
                        *ngIf="
                            emailFormControl.hasError('email') &&
                            !emailFormControl.hasError('required')
                        "
                        >Please enter a valid email address</mat-error
                    >
                    <mat-error *ngIf="emailFormControl.hasError('required')"
                        >Email is <strong>required</strong></mat-error
                    >
                </mat-form-field>

                <div
                    class="availability-error"
                    *ngIf="emailAvailable === false"
                >
                    Email is already registered
                </div>
                <div
                    class="availability-checking"
                    *ngIf="emailChecking"
                >
                    Checking availability...
                </div>

                <mat-form-field class="form-field">
                    <mat-label>Enter your password</mat-label>
                    <input
                        matInput
                        [type]="hide() ? 'password' : 'text'"
                        [(ngModel)]="userSignUp.password"
                        name="password"
                        required
                    />
                </mat-form-field>

                <div class="login-button">
                    <button
                        type="submit"
                        mat-flat-button
                        color="primary"
                        [disabled]="form.form.invalid"
                    >
                        Sign Up
                    </button>
                </div>
            </form>
        </div>
        <div class="sign-up">
            Do you already have an account?
            <a [routerLink]="['/login']">Sign In Now</a>
        </div>
    </div>
</section>
