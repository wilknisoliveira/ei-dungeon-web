<section>
    <div class="atmospheric-bg"></div>
    <app-loading [isLoading]="loading"></app-loading>
    <div class="main-container" *ngIf="!loading">
        <div class="login">
            <div class="theme-button">
                <app-theme-toggle></app-theme-toggle>
            </div>
            <div class="title">
                <app-branding-icon></app-branding-icon>
                <span class="wordmark">EI-DUNGEON</span>
            </div>
            <div class="description">Log in to your account</div>

            <form (ngSubmit)="onSubmit()" #form="ngForm">
                <mat-form-field class="example-full-width">
                    <mat-label>Username</mat-label>
                    <input
                        matInput
                        [(ngModel)]="userLogin.userName"
                        name="username"
                        required
                    />
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Enter your password</mat-label>
                    <input
                        matInput
                        [type]="hide() ? 'password' : 'text'"
                        [(ngModel)]="userLogin.password"
                        name="password"
                        required
                    />
                </mat-form-field>

                <div class="login-button">
                    <button
                        type="submit"
                        mat-flat-button
                        color="primary"
                        [disabled]="form.form.invalid"
                    >
                        Login
                    </button>
                </div>
            </form>
        </div>
        <div class="sign-up">
            Don't have an account? <a [routerLink]="['/signup']">Sign Up Now</a>
        </div>
    </div>
</section>
