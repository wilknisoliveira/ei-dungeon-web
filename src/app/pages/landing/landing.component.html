<div class="landing">
    <!-- No reveal on the header: a transform on its host would break position: sticky. -->
    <app-landing-header
        [isLoggedIn]="isLoggedIn()"
        [isInDevelopment]="isInDevelopment"
    ></app-landing-header>

    <main>
        <app-landing-hero
            appRevealOnScroll
            [isLoggedIn]="isLoggedIn()"
            [isInDevelopment]="isInDevelopment"
        ></app-landing-hero>
        <app-landing-problem appRevealOnScroll></app-landing-problem>
        <app-landing-how-it-works appRevealOnScroll></app-landing-how-it-works>
        <app-landing-features appRevealOnScroll></app-landing-features>
        <app-landing-development appRevealOnScroll></app-landing-development>
        <app-landing-faq appRevealOnScroll></app-landing-faq>
        <app-landing-cta
            appRevealOnScroll
            [isLoggedIn]="isLoggedIn()"
            [isInDevelopment]="isInDevelopment"
        ></app-landing-cta>
    </main>

    <app-landing-footer appRevealOnScroll></app-landing-footer>
</div>
