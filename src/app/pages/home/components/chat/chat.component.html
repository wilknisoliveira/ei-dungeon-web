<section *ngIf="(playsPagedSearch?.items?.length ?? 0) === 0" class="game-ready">
    <p i18n="@@chatGameReady">Your new game is ready!</p>
    <button
        type="submit"
        mat-flat-button
        color="primary"
        (click)="onSubmit(true)"
        i18n="@@chatStartButton"
    >
        Start
    </button>
</section>
<section *ngIf="(playsPagedSearch?.items?.length ?? 0) > 0" class="game-playing">
    <div class="game-toolbar">
        <mat-form-field appearance="outline" class="game-language-select">
            <mat-label i18n="@@chatLanguageLabel">Language</mat-label>
            <mat-select [formControl]="gameLanguageFormControl" (selectionChange)="onLanguageChange()">
                <mat-option *ngFor="let lang of gameLanguages" [value]="lang.value">
                    {{ lang.abbreviation }}
                </mat-option>
            </mat-select>
            <mat-icon
                class="info-icon"
                matTooltip="Language used by the Game Master for narration and dialogue"
                i18n-matTooltip="@@gameLanguageTooltip"
                matSuffix
            >info</mat-icon>
        </mat-form-field>
    </div>
    <div class="messages" #messagesContainer (scroll)="onScroll($event)">
        <div class="messages-content">
            <div *ngIf="isLoadingMore" class="loading-more">
                <app-small-loading [isLoading]="isLoadingMore"></app-small-loading>
            </div>
            <mat-list role="list">
                <mat-list-item
                    *ngFor="let play of playsPagedSearch?.items"
                    role="listitem"
                    [ngClass]="{
                        user: play.playerDtoResponse.type === 'RealPlayer',
                        'other-player':
                            play.playerDtoResponse.type !== 'RealPlayer',
                    }"
                >
                    <div class="span-container">
                        <span matListItemTitle>{{
                            getDisplayName(play)
                        }}</span>
                        <span>{{ play.prompt }}</span>
                    </div>
                </mat-list-item>
            </mat-list>
        </div>
    </div>

    <div class="input">
        <div class="input-area">
            <form [formGroup]="newPlayFormGroup">
                <textarea
                    [placeholder]="activePlaceholder"
                    (input)="onInputChange($event)"
                    rows="1"
                    formControlName="newPlayControl"
                    name="newPlayControl"
                    [disabled]="isDisabled"
                    #textAreaContainer
                ></textarea>

                <button
                    *ngIf="!loading"
                    type="submit"
                    mat-icon-button
                    color="primary"
                    (click)="onSubmit()"
                    [disabled]="
                        newPlayFormGroup.get('newPlayControl')?.value == '' ||
                        game?.gameStatus === 'PlayerDied'
                    "
                >
                    <mat-icon
                        aria-hidden="false"
                        aria-label="play"
                        fontIcon="send"
                    ></mat-icon>
                </button>
                <div *ngIf="loading" class="loading">
                    <app-small-loading
                        [isLoading]="loading"
                    ></app-small-loading>
                </div>
            </form>
        </div>
    </div>
</section>
