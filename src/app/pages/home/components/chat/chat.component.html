<section
    *ngIf="(playsPagedSearch?.items?.length ?? 0) === 0"
    class="game-ready atmospheric-bg"
>
    <p i18n="@@chatGameReady">Your new game is ready!</p>
    <button
        type="submit"
        mat-flat-button
        color="primary"
        (click)="onSubmit(true)"
        i18n="@@chatStartButton"
    >
        Start
    </button>
</section>
<section
    *ngIf="(playsPagedSearch?.items?.length ?? 0) > 0"
    class="game-playing atmospheric-bg"
>
    <div class="game-toolbar">
        <button
            mat-icon-button
            [matMenuTriggerFor]="gameOptionsMenu"
            matTooltip="Game options"
        >
            <mat-icon fontIcon="more_horiz"></mat-icon>
        </button>
        <mat-menu #gameOptionsMenu="matMenu">
            <button
                mat-menu-item
                [matMenuTriggerFor]="languageMenu"
                matTooltip="Language used by the Game Master for narration and dialogue"
                i18n-matTooltip="@@gameLanguageTooltip"
            >
                <mat-icon fontIcon="language"></mat-icon>
                <span i18n="@@chatLanguageLabel">Language</span>
            </button>
        </mat-menu>
        <mat-menu #languageMenu="matMenu">
            <button
                *ngFor="let lang of gameLanguages"
                mat-menu-item
                (click)="selectLanguage(lang.value)"
            >
                <span>{{ lang.abbreviation }}</span>
                <mat-icon
                    [style.visibility]="
                        currentGameLanguage === lang.value
                            ? 'visible'
                            : 'hidden'
                    "
                    fontIcon="check"
                ></mat-icon>
            </button>
        </mat-menu>
    </div>
    <div class="messages" #messagesContainer (scroll)="onScroll($event)">
        <div class="messages-content">
            <div *ngIf="isLoadingMore" class="loading-more">
                <app-small-loading
                    [isLoading]="isLoadingMore"
                ></app-small-loading>
            </div>
            <div class="messages-list" role="list">
                <div
                    *ngFor="let play of playsPagedSearch?.items"
                    class="message"
                    role="listitem"
                    [ngClass]="{
                        user: play.playerDtoResponse.type === 'RealPlayer',
                        'other-player':
                            play.playerDtoResponse.type !== 'RealPlayer',
                    }"
                >
                    <div class="span-container">
                        <span>{{ getDisplayName(play) }}</span>
                        <span>{{ play.prompt }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="input">
        <div class="input-area">
            <form [formGroup]="newPlayFormGroup">
                <textarea
                    [placeholder]="activePlaceholder"
                    (input)="onInputChange($event)"
                    rows="1"
                    formControlName="newPlayControl"
                    name="newPlayControl"
                    [disabled]="isDisabled"
                    #textAreaContainer
                ></textarea>

                <button
                    *ngIf="!loading"
                    type="submit"
                    mat-icon-button
                    color="primary"
                    (click)="onSubmit()"
                    [disabled]="
                        newPlayFormGroup.get('newPlayControl')?.value == '' ||
                        game?.gameStatus === 'PlayerDied'
                    "
                >
                    <mat-icon
                        aria-hidden="false"
                        aria-label="play"
                        fontIcon="send"
                    ></mat-icon>
                </button>
                <div *ngIf="loading" class="loading">
                    <app-small-loading
                        [isLoading]="loading"
                    ></app-small-loading>
                </div>
            </form>
        </div>
    </div>
</section>
