<section class="main-container">
    <mat-drawer-container autosize>
        <mat-drawer #drawer mode="side" opened>
            <div class="center-btn-container">
                <button
                    class="new-play-btn"
                    (click)="gameSelected = ''"
                    mat-raised-button
                >
                    <mat-icon
                        aria-hidden="false"
                        aria-label="logo"
                        fontIcon="add"
                    ></mat-icon
                    >New Role
                </button>
            </div>

            <div class="plays">
                <div *ngFor="let game of gamePagedSearch?.items">
                    <div
                        class="game-name"
                        [ngClass]="{
                            selected: gameSelected === game.id,
                        }"
                    >
                        <div class="game-button">
                            <button (click)="setGame(game.id)" mat-flat-button>
                                <mat-icon
                                    aria-hidden="false"
                                    aria-label="logo"
                                    fontIcon="bolt"
                                ></mat-icon>
                                {{ game.name }}
                            </button>
                        </div>
                        <div class="trash-button">
                            <button
                                (click)="openDeleteDialog(game.id, game.name)"
                                mat-flat-button
                            >
                                <mat-icon
                                    aria-hidden="false"
                                    aria-label="logo"
                                    fontIcon="delete"
                                ></mat-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="center-btn-container" *ngIf="enableShowMoreBtn">
                <button
                    class="show-more-btn"
                    (click)="showMore()"
                    mat-flat-button
                >
                    Show more
                </button>
            </div>
        </mat-drawer>

        <mat-drawer-content>
            <div class="header-menu">
                <div class="nav-btn-container">
                    <button type="button" mat-button (click)="drawer.toggle()">
                        <mat-icon
                            aria-hidden="false"
                            aria-label="logo"
                            fontIcon="menu"
                        ></mat-icon>
                    </button>
                </div>
                <div class="header-actions">
                    <div class="theme-button">
                        <app-theme-toggle></app-theme-toggle>
                    </div>
                    <div class="profile-button">
                        <button
                            type="button"
                            mat-icon-button
                            [matMenuTriggerFor]="profileMenu"
                        >
                            <mat-icon
                                aria-hidden="false"
                                aria-label="profile"
                                fontIcon="account_circle"
                            ></mat-icon>
                        </button>
                        <mat-menu #profileMenu="matMenu">
                            <button
                                mat-menu-item
                                (click)="navigateToSettings()"
                            >
                                <mat-icon fontIcon="settings"></mat-icon>
                                Settings
                            </button>
                            <button mat-menu-item (click)="logout()">
                                <mat-icon fontIcon="logout"></mat-icon>
                                Logout
                            </button>
                        </mat-menu>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <app-chat
                    *ngIf="gameSelected"
                    [gameId]="gameSelected"
                ></app-chat>
                <app-first-steps
                    *ngIf="!gameSelected"
                    (gameCreated)="gameCreated($event)"
                ></app-first-steps>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</section>
