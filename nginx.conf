user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    map $http_accept_language $preferred_locale {
        default en;
        ~*^pt pt-BR;
        ~*^es es;
        ~*^en en;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        absolute_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            return 302 /$preferred_locale/$is_args$args;
        }

        location = /robots.txt {
            try_files /robots.txt =404;
            add_header Cache-Control "no-cache" always;
        }

        location = /sitemap.xml {
            try_files /sitemap.xml =404;
            add_header Cache-Control "no-cache" always;
        }

        location = /en {
            return 301 /en/$is_args$args;
        }

        location = /pt-BR {
            return 301 /pt-BR/$is_args$args;
        }

        location = /es {
            return 301 /es/$is_args$args;
        }

        location = /en/ {
            try_files /en/index.html =404;
            add_header Cache-Control "no-cache" always;
        }

        location = /pt-BR/ {
            try_files /pt-BR/index.html =404;
            add_header Cache-Control "no-cache" always;
        }

        location = /es/ {
            try_files /es/index.html =404;
            add_header Cache-Control "no-cache" always;
        }

        location ~* "^/(?:en|pt-BR|es)/.+-[a-z0-9]{8,}\.(?:js|css)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* ^/(?:en|pt-BR|es)/.*\.(?:avif|eot|gif|ico|jpe?g|json|map|png|svg|ttf|webp|woff2?)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location /en/ {
            try_files $uri $uri/ /en/index.csr.html$is_args$args;
            add_header Cache-Control "no-cache" always;
        }

        location /pt-BR/ {
            try_files $uri $uri/ /pt-BR/index.csr.html$is_args$args;
            add_header Cache-Control "no-cache" always;
        }

        location /es/ {
            try_files $uri $uri/ /es/index.csr.html$is_args$args;
            add_header Cache-Control "no-cache" always;
        }

        location / {
            return 404;
        }
    }
}
